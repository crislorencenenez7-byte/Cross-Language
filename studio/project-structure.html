<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CROSS — Project Structure</title><link rel="stylesheet" href="./css/studio.css"><style>
body{background:#0b1120;color:#e5edf8}.shell{max-width:760px;margin:auto;padding:16px}.card{background:#142238;border:1px solid #293e59;border-radius:12px;padding:16px;margin:14px 0}.row{padding:12px;margin:5px 0;background:#0b1728;border-radius:8px;overflow-wrap:anywhere;cursor:pointer}.file{color:#79c5ff}button{padding:11px 14px;margin:4px;border:0;border-radius:8px;background:#168bd0;color:white;font-weight:bold}.secondary{background:#263c57}.muted{color:#9eb0c7;font-size:13px}
</style></head><body><main class="shell"><header><a href="./editor.html">← Create Project</a></header><h1 id="title">Project Structure</h1><section class="card"><h2>Project Explorer</h2><button id="folder">＋ Folder</button><button id="file">＋ File</button><div id="tree">Loading...</div><p id="status" class="muted"></p></section><section class="card"><h2>Help</h2><p class="muted">Create folders to organize your project. Create .x, .xsharp, or .xs files and select a file to edit it.</p></section></main>
<script>
const API="http://127.0.0.1:8300/api",id=new URLSearchParams(location.search).get("id"),$=x=>document.getElementById(x);
async function api(path,opt={}){const r=await fetch(API+path,{...opt,headers:{"Content-Type":"application/json"}});const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||"Request failed");return d;}
async function refresh(){try{const d=await api("/projects/"+id);$("title").textContent=d.project.name;const t=await api("/projects/"+id+"/tree");$("tree").innerHTML="";for(const item of t.items){const el=document.createElement("div");el.className="row "+(item.type==="file"?"file":"");el.textContent=(item.type==="folder"?"📁 ":"📄 ")+item.path;if(item.type==="file")el.onclick=()=>location.href="./code-editor.html?id="+id+"&path="+encodeURIComponent(item.path);$("tree").append(el);}}catch(e){$("status").textContent=e.message;}}
async function add(type){const name=prompt(type==="folder"?"Folder name:":"File name (e.g. scripts/main.xs):");if(!name)return;try{await api("/projects/"+id+"/items",{method:"POST",body:JSON.stringify({type,path:name})});refresh();}catch(e){alert(e.message);}}
$("folder").onclick=()=>add("folder");$("file").onclick=()=>add("file");refresh();
</script><script src="./js/version-check.js"></script></body></html>
