<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080f1d">
<title>CROSS Studio — Code Workspace</title>
<link rel="stylesheet" href="./css/studio.css">
<link rel="stylesheet" href="./css/workspace.css">
</head>
<body class="workspace-body">
<header class="workspace-topbar">
  <a class="workspace-brand" href="./editor.html">CROSS <span>STUDIO 3.0</span></a>
  <div class="workspace-project" id="project-name">Loading project…</div>
  <div class="workspace-actions">
    <button id="new-folder" class="tool-button" type="button">＋ Folder</button>
    <button id="new-file" class="tool-button" type="button">＋ File</button>
    <button id="save-file" class="tool-button primary" type="button">Save</button>
    <button id="open-preview" class="tool-button accent" type="button">▶ Preview</button>
  </div>
</header>
<main class="workspace-layout">
  <aside class="explorer-panel" aria-label="Project explorer">
    <div class="panel-heading"><span>EXPLORER</span><span id="file-count">0 files</span></div>
    <div class="explorer-project" id="explorer-project">PROJECT</div>
    <div id="file-tree" class="file-tree"><p class="empty-state">Loading files…</p></div>
  </aside>
  <section class="editor-panel">
    <nav id="editor-tabs" class="editor-tabs" aria-label="Open files">
      <span class="empty-tab">No file open</span>
    </nav>
    <div class="editor-toolbar">
      <div><span id="active-path">Select a file from Explorer</span><span id="dirty-indicator"></span></div>
      <div class="editor-tools">
        <div class="language-switch" aria-label="CROSS language entry files"><button class="language-tab" data-language="X" type="button">X</button><button class="language-tab" data-language="X#" type="button">X#</button><button class="language-tab" data-language="XS" type="button">XS</button></div>
        <span id="language-badge" class="language-badge">CROSS</span>
        <button id="compile-file" class="tool-button small" type="button">Compile</button>
      </div>
    </div>
    <div class="code-area" id="code-area">
      <div id="line-numbers" class="line-numbers" aria-hidden="true">1</div>
      <textarea id="source" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="Code editor" placeholder="Choose a file from the Explorer to start editing…" disabled></textarea>
    </div>
    <section class="output-panel">
      <div class="output-heading"><span>OUTPUT</span><button id="clear-output" class="text-button" type="button">Clear</button></div>
      <pre id="output">CROSS compiler output will appear here.</pre>
    </section>
  </section>
</main>
<footer class="workspace-statusbar">
  <span id="workspace-status">Connecting to CROSS workspace…</span>
  <span id="cursor-status">Ln 1, Col 1</span>
  <span id="encoding-status">UTF-8</span>
</footer>
<script src="./js/api-config.js"></script>
<script type="module" src="./js/workspace-editor.js"></script>
<script src="./js/version-check.js"></script>
</body>
</html>
