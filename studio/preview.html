<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08111f">
<title>CROSS Studio — Live Project Preview</title>
<style>
:root{color-scheme:dark;--bg:#08111f;--panel:#111f33;--line:#263b57;--muted:#9db0c8;--cyan:#5bd4ee;--text:#edf5ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#1a3c60,transparent 48%),var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,Arial,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);background:#0c1829;position:sticky;top:0;z-index:2}header a{color:var(--cyan);text-decoration:none}main{max-width:1200px;margin:auto;padding:20px}.panel{background:linear-gradient(145deg,#152740,#101d30);border:1px solid var(--line);border-radius:15px;padding:17px;margin-bottom:15px;box-shadow:0 12px 32px #0002}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.muted,#status{color:var(--muted);font-size:13px}button,select{border:1px solid #345477;background:#1b3552;color:white;border-radius:9px;padding:9px 13px;font:inherit}button{cursor:pointer;font-weight:700;background:linear-gradient(120deg,#167bd0,#13a2c7)}button.secondary{background:#1b304a}#site{background:#fff;color:#17243a;min-height:360px;padding:25px;border-radius:11px;overflow:auto}#site button{cursor:pointer}#site img{max-width:100%}#site [data-cross-component="App"],#site [data-cross-component="Page"]{width:100%}#console{white-space:pre-wrap;overflow-wrap:anywhere;background:#091522;border:1px solid #263b57;border-radius:9px;padding:13px;min-height:80px;color:#a8edc2;font:13px/1.7 ui-monospace,monospace}.error{color:#ff9292!important}.source-meta{display:flex;gap:8px;flex-wrap:wrap}.source-chip{border:1px solid #345477;border-radius:20px;padding:4px 9px;color:#b8d8f2;font-size:11px}
@media(max-width:600px){main{padding:11px}header{padding:11px 13px}#site{padding:14px}.panel{padding:13px}}
</style>
</head>
<body>
<header><strong>CROSS <span style="color:#5bd4ee">3.0</span> · LIVE PROJECT PREVIEW</strong><a id="back" href="./editor.html">← Back to Studio</a></header>
<main>
<section class="panel"><div class="top"><div><h2 id="project-name">Loading project…</h2><p id="status">Connecting to project files…</p><div id="source-files" class="source-meta"></div></div><div class="top"><button id="refresh" class="secondary" type="button">↻ Refresh</button><label class="muted"><input id="auto-refresh" type="checkbox" checked> Auto refresh</label></div></div></section>
<section class="panel"><h3>Website Output</h3><div id="site">Loading project source files…</div></section>
<section class="panel"><div class="top"><div><h3>XS Runtime</h3><p class="muted">Runs XS code from the selected project file in the restricted CROSS interpreter.</p></div><div class="top"><select id="xs-function" aria-label="XS function"></select><button id="run-xs" type="button">▶ Run XS</button></div></div><pre id="console">Waiting for XS source…</pre></section>
</main>
<script src="./js/api-config.js"></script>
<script type="module">
import { renderCROSS } from "./js/preview-renderer.js";
import { callXS } from "../languages/xs/index.js";
const API=window.CROSS_API_BASE||"http://127.0.0.1:8300/api";
const id=new URLSearchParams(location.search).get("id");
const $=name=>document.getElementById(name);
let currentResult=null,lastSnapshot="",refreshing=false;
$("back").href=id?`./project-structure.html?id=${encodeURIComponent(id)}`:"./editor.html";
function showError(error){$("status").textContent=`Preview error: ${error.message}`;$("status").classList.add("error");$("site").textContent="Unable to render this project.";$("console").textContent=error.message;$("console").classList.add("error");}
async function request(path){const response=await fetch(`${API}${path}`,{cache:"no-store"});const data=await response.json();if(!response.ok||!data.success)throw new Error(data.error||`Request failed (${response.status})`);return data;}
function chooseSource(files,metadata,language,extension){
 const configured=metadata?.entry_points?.[language];
 if(configured&&files[configured]?.trim())return configured;
 return Object.keys(files).filter(path=>path.toLowerCase().endsWith(extension)&&files[path].trim()).sort((a,b)=>a.split("/").length-b.split("/").length||a.localeCompare(b))[0]||"";
}
async function loadPreview(force=false){
 if(refreshing)return;refreshing=true;
 try{
  if(!id||!/^\d+$/.test(id))throw new Error("Invalid or missing project ID.");
  const projectData=await request(`/projects/${encodeURIComponent(id)}`);
  const tree=await request(`/projects/${encodeURIComponent(id)}/tree`);
  const paths=(tree.items||[]).filter(item=>item.type==="file").map(item=>item.path);
  const contents=await Promise.all(paths.map(async path=>{const result=await request(`/projects/${encodeURIComponent(id)}/file?path=${encodeURIComponent(path)}`);return [path,result.content];}));
  const files=Object.fromEntries(contents);
  let metadata={};try{metadata=JSON.parse(files["project.json"]||"{}");}catch(_){metadata={};}
  const xPath=chooseSource(files,metadata,"X",".x");
  const xsharpPath=chooseSource(files,metadata,"X#",".xsharp");
  const xsPath=chooseSource(files,metadata,"XS",".xs");
  if(!xPath)throw new Error("No non-empty .x file found. Create a .x file and add your website structure.");
  const snapshot=JSON.stringify({files,xPath,xsharpPath,xsPath});
  if(!force&&snapshot===lastSnapshot)return;
  const project=projectData.project;
  $("project-name").textContent=project.name;
  currentResult=renderCROSS({x:files[xPath],xsharp:xsharpPath?files[xsharpPath]:"",xs:xsPath?files[xsPath]:""},$("site"));
  lastSnapshot=snapshot;
  $("source-files").replaceChildren();
  for(const [label,path] of [["X",xPath],["X#",xsharpPath],["XS",xsPath]])if(path){const chip=document.createElement("span");chip.className="source-chip";chip.textContent=`${label}: ${path}`;$("source-files").append(chip);}
  $("status").textContent=`Live preview ready · ${currentResult.componentCount} components · ${paths.length} project files`;
  $("status").classList.remove("error");
  const select=$("xs-function");select.replaceChildren();
  for(const name of currentResult.xsFunctions){const option=document.createElement("option");option.value=name;option.textContent=name;select.append(option);}
  $("run-xs").disabled=!currentResult.logic;
  $("console").textContent=currentResult.logic?`XS loaded from ${xsPath}\n${currentResult.xsFunctions.length} function(s) available. Select a function and press Run XS.`:"No non-empty .xs source file found.";
  $("console").classList.remove("error");
 }catch(error){showError(error);}finally{refreshing=false;}
}
$("run-xs").addEventListener("click",()=>{try{if(!currentResult?.logic)throw new Error("No compiled XS program is available.");const result=callXS(currentResult.logic,$("xs-function").value);$("console").textContent=`Function: ${result.function}\nOutput:\n${result.output.map(value=>typeof value==="object"?JSON.stringify(value):String(value)).join("\n")||"(no output)"}\n\nReturn: ${JSON.stringify(result.result)}\nVariables: ${JSON.stringify(result.variables,null,2)}`;$("console").classList.remove("error");}catch(error){$("console").textContent=`XS runtime error: ${error.message}`;$("console").classList.add("error");}});
$("refresh").addEventListener("click",()=>loadPreview(true));
try{const channel=new BroadcastChannel(`cross-project-${id}`);channel.addEventListener("message",event=>{if(event.data?.type==="file-saved")loadPreview(true);});}catch(_){}
setInterval(()=>{if($("auto-refresh").checked)loadPreview(false);},2500);
loadPreview(true);
</script>
</body>
</html>
